<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- Gradients for realistic 3D look -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a3ff"/>
      <stop offset="100%" stop-color="#0047d4"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cf542"/>
      <stop offset="100%" stop-color="#1b9e11"/>
    </linearGradient>
    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Blue 'e' -->
  <path d="M 180 180 C 180 230, 140 250, 90 250 C 40 250, 20 200, 20 150 C 20 90, 60 70, 110 70 C 160 70, 180 110, 180 150 L 180 160 L 60 160 C 65 190, 80 210, 110 210 C 130 210, 145 200, 150 180 Z M 145 130 C 140 100, 120 100, 110 100 C 90 100, 70 110, 65 130 Z" fill="url(#blueGrad)" filter="url(#shadow)" stroke="#0077ff" stroke-width="2"/>

  <!-- Green 'F' -->
  <path d="M 200 240 L 200 80 C 200 60, 210 50, 240 50 L 300 50 L 300 80 L 250 80 L 250 130 L 290 130 L 290 160 L 250 160 L 250 240 Z" fill="url(#greenGrad)" filter="url(#shadow)" stroke="#42f55a" stroke-width="2"/>

  <!-- Bars behind Arrow -->
  <rect x="185" y="170" width="15" height="70" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <rect x="210" y="150" width="20" height="90" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <rect x="240" y="160" width="25" height="80" fill="url(#greenGrad)" filter="url(#shadow)"/>
  
  <!-- Upward Arrow sweeping across -->
  <path d="M 90 235 Q 200 190, 260 110 L 250 105 L 285 100 L 275 140 L 265 135 Q 210 210, 90 245 Z" fill="url(#greenGrad)" stroke="white" stroke-width="1.5" filter="url(#shadow)"/>
</svg>
