<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Shivam Loans home">
    <span class="brand-mark" aria-hidden="true">
      <span></span>
    </span>
    <span class="brand-copy">
      <strong>Shivam Loans</strong>
      <small>much more than money</small>
    </span>
  </a>

  <nav class="primary-nav" aria-label="Primary navigation">
    <a routerLink="/" [queryParams]="{ tab: 'overview' }">Dashboard</a>
    <a routerLink="/loans">Loans</a>
    <a routerLink="/" [queryParams]="{ tab: 'emi' }">EMI</a>
    <a routerLink="/" [queryParams]="{ tab: 'eligibility' }">Eligibility</a>
    <a routerLink="/about">About Us</a>
    <a routerLink="/" fragment="contact">Contact</a>
  </nav>

  <div class="topbar-actions">
    @if (currentUser(); as user) {
    <span class="user-chip">{{ user.fullName || user.phoneNumber }}</span>
    <button class="ghost-button" type="button" (click)="logout()">Logout</button>
    } @else {
    <button class="ghost-button" type="button" (click)="openAuth('signup')">
      Sign up
    </button>
    <button class="primary-button compact" type="button" (click)="openAuth('login')">
      Sign in
    </button>
    }
  </div>
</header>
